[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthcare-agents"
version = "0.3.0"
description = "Classroom Healthcare Medicaid Customer Service Agentic AI — multi-agent orchestration for eligibility, claims, prior auth, and member support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Classroom Healthcare Medicaid CS Agentic AI Contributors" }]
keywords = ["healthcare", "agentic-ai", "fhir", "clinical-ai", "multi-agent", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
orchestration = ["langgraph>=0.2", "langchain-core>=0.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
evaluation = [
    "rouge-score>=0.1",
    "bert-score>=0.3.2",
    "detoxify>=0.5",
    "deepeval>=1.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "healthcare-agents[openai]",
]
all = [
    "healthcare-agents[openai,orchestration,api,evaluation]",
]

[project.scripts]
healthcare-agent = "healthcare_agents.cli:main"
healthcare-api = "healthcare_agents.api.server:main"
healthcare-chat = "healthcare_agents.cli_chat:main"

[project.urls]
Homepage = "https://github.com/your-org/classroom-Healhcare-medicaid-customer-service-agenticAI"
Documentation = "https://github.com/your-org/classroom-Healhcare-medicaid-customer-service-agenticAI/tree/main/docs"
Repository = "https://github.com/your-org/classroom-Healhcare-medicaid-customer-service-agenticAI"
Issues = "https://github.com/your-org/classroom-Healhcare-medicaid-customer-service-agenticAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/healthcare_agents", "tests", "examples", "docs", "scripts", "deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring external services",
    "slow: slow tests (evaluation ML models)",
]

[tool.coverage.run]
source = ["healthcare_agents"]
branch = true
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["healthcare_agents"]
